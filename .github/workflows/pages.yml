# GitHub Pages 部署（Actions 模式）
# 只部署 index.html（自包含单文件，2MB），避免打包整个仓库导致部署卡死
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        # 只把 index.html 放进 _site 目录，artifact 体积从整个仓库降到 2MB 单文件
        run: |
          mkdir -p _site
          cp index.html _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
